name: Build LaTeX PDF

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: vorlage.tex
          args: "-pdf -file-line-error -interaction=nonstopmode"

      - name: Generate timestamp
        id: timestamp
        run: echo "timestamp=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT

      - name: Prepare artifact PDF file
        run: cp vorlage.pdf "Project_Report_${{ steps.timestamp.outputs.timestamp }}.pdf"

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Project_Report_${{ steps.timestamp.outputs.timestamp }}.pdf
          path: Project_Report_${{ steps.timestamp.outputs.timestamp }}.pdf


